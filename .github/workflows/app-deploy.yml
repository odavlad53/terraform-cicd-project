name: 'Build and Deploy App'

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/app-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: olga-project-dev-app
  ECS_CLUSTER: olga-project-dev-cluster
  ECS_SERVICE: olga-project-dev-service

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: 'Lint & Test'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image (validates Dockerfile)
      working-directory: ./app
      run: docker build -t app-test .

    - name: Run container smoke test
      run: |
        docker run -d --name test-container -p 3000:3000 app-test
        sleep 5
        curl -f http://localhost:3000 || exit 1
        curl -f http://localhost:3000/health || exit 1
        docker stop test-container

  build-and-push:
    name: 'Build & Push to ECR'
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and tag image
      working-directory: ./app
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

    - name: Trivy vulnerability scan
      uses: aquasecurity/trivy-action@master
      with: 
         image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha}}
         format: 'sarif'
         output: 'trivy-results.sarif'
         exit-code: '1'
         severity: 'CRITICAL,HIGH'
         ignore-unfixed: true
    
    - name: Upload Trivy results to GItHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
         sarif_file: 'trivy-results.sarif'
    
    - name: Push image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign image with cosign (keyless)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
         IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG)
         cosign sign --yes $IMAGE_DIGEST 
       

  deploy:
    name: 'Deploy to ECS'
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Verify image signature
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cosign verify \
          --certificate-identity-regexp "https://github.com/odavlad53/.*" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Download current task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition olga-project-dev-app \
          --query taskDefinition \
          > task-definition.json

    - name: Update task definition with new image
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: olga-project-app
        image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

    - name: Deploy to ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        wait-max-delay-seconds: 15
 
