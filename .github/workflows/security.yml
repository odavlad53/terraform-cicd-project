name: Security Scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - 'terraform-infrastructure/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform-infrastructure/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  secret-scanning:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --exclude-paths .trufflehogignore

  dependency-scanning:
    name: Dependency / Config Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: 'terraform-infrastructure'
          trivyignores: terraform-infrastructure/.trivyignore
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  terraform-compliance:
    name: Terraform Compliance Check (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform-infrastructure/
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_18,CKV_AWS_144,CKV2_AWS_62,CKV_AWS_145,CKV_AWS_88,CKV_AWS_135,CKV_AWS_356,CKV_AWS_109,CKV_AWS_111,CKV_AWS_2,CKV_AWS_382,CKV_AWS_260,CKV_AWS_103,CKV2_AWS_20,CKV2_AWS_28,CKV_AWS_378

